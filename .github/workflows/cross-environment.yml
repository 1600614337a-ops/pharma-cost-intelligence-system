name: Cross-environment Docker verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-smoke-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build portable image
        run: docker compose -p pharma-cost-intelligence build

      - name: Run complete test suite in an isolated container
        run: >-
          docker compose -p pharma-cost-intelligence run --rm --no-deps
          --entrypoint python cost-intelligence -m unittest discover -s tests

      - name: Start and wait for health check
        run: docker compose -p pharma-cost-intelligence up -d --wait --wait-timeout 240

      - name: Verify dashboard health endpoint
        run: curl --fail --show-error --silent http://127.0.0.1:8080/health

      - name: Show logs after failure
        if: failure()
        run: docker compose -p pharma-cost-intelligence logs --no-color

      - name: Stop services
        if: always()
        run: docker compose -p pharma-cost-intelligence down --volumes --remove-orphans
